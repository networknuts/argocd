apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  labels:
    app: nginxx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginxx
  template:
    metadata:
      labels:
        app: nginxx
    spec:
      containers:
      - name: boxone
        image: nginx:1.14.2
        ports:
        - containerPort: 80
